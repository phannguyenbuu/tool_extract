      const wrap = document.getElementById('stageWrap');

        if (idx == null || idx < 0) return 0;

        if (t <= 0) return 0;

          shape.visible(true);

        layerPacked.draw();
        layerMove.draw();
      };

      const tick = (now) => {

        playBtn.textContent = simPlaying ? '❚❚' : '▶';
        if (simPlaying) requestAnimationFrame(tick);
      });

        simProgress = parseFloat(e.target.value || '0');
        update();
      });
      update();
